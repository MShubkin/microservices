[workspace]
resolver = "2"
members = [

    # Shared packages.
    "shared/broker",
    "shared/env-setup",
    "shared/fieldname-access",
    "shared/http-middleware",
    "shared/igg-tracing",
    "shared/rabbit-services",
    "shared/shared-db",
    "shared/shared-db-derive",
    "shared/shared-essential",
    "shared/table-entities",
    "shared/trace-setup",
    "shared/monolith-service",
    "shared/format-tools",
    "shared/testing",
    "shared/macros",
    # Services and modules
    "technical-commercial-proposal",
    "processing",
    "master-data-service",
]

[profile.dev]
opt-level = 0
debug = 1
incremental = false
lto = false

[profile.dev-pipeline]
inherits = "dev"
strip = true
opt-level = 's'
debug = 1
incremental = false
lto = false

[profile.test]
incremental = false
lto = false
debug = 2
codegen-units = 16

[profile.release]
incremental = false
lto = false
codegen-units = 16
opt-level = 2
debug = 0

[workspace.dependencies]
actix-cors = "=0.6.1"
actix-http = "=3.0.4"
actix-session = {version = "0.6.2", features = ["cookie-session"] }
actix-web = { version = "=4.0.1", features = ["cookie"] }
actix-multipart = "0.4.0"
ahash = { version = "0.8", features = ["serde"] }
amqprs = { version = "=1.5.3", features = ["traces"] }
amqp_serde = { version = "=0.4.1" }
anyhow = { version = "1.0.56" }
async-trait = "=0.1.52"
base64 = "=0.13.1"
bytes = "=1.5.0"
bzip2 = "0.4.3"
calamine = "0.18.0"
chrono = { version = "=0.4.19", features = [ "serde" ] }
derive_more = { version = "=0.99.17", features = ["constructor"] }
either = "=1.6.1"
futures = "=0.3.19"
futures-util = "=0.3.31"
heck = "=0.4.0"
hyper = {version = "=0.14.18", features = ["client", "http1", "tcp"] }
indexmap = { version = "=1.8.0", features = ["serde"] }
itertools = "=0.10.3"
lazy_static="=1.4.0"
lettre = { version = "=0.10.0-rc.4", features = ["builder","hostname","smtp-transport","tokio1", "tokio1-native-tls"], default-features = false }
local-ip-address = "=0.4.4"
log = "=0.4.14"
mime = "=0.3.16"
mime_guess = "=2.0.4"
once_cell = "1"
paste = "=1.0.7"
proc-macro2 = "=1.0.78"
quick-xml = "=0.19.0"
quote = "=1.0.35"
rand = "=0.8.5"
rayon = "=1.5.1"
regex = "=1.5.4"
reqwest = { version = "=0.11.10", features = ["json", "default-tls", "multipart"], default-features = false }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = { version = "=1.0.79", features = ["raw_value"] }
serde-xml-rs = "=0.6.0"
sqlx = { version = "=0.5.13", features = [ "uuid", "time", "runtime-tokio-rustls", "postgres", "offline", "json", "chrono" ] }
syn = { version = "=2.0.52", features = ["derive","full", "extra-traits"] }
tempfile = "3"
thiserror = "=1.0.30"
time = { version = "=0.3.9", features = ["macros", "serde", "formatting", "parsing"] }
tokio = { version = "=1.18.0", features = ["full"] }
tracing = "=0.1.34"
tracing-actix-web = { version = "=0.5.1", features = ["opentelemetry_0_17"] }
tracing-appender = "=0.2.2"
tracing-bunyan-formatter = "=0.3.2"
tracing-futures = "=0.2.5"
tracing-opentelemetry = { version = "=0.17.2" }
tracing-subscriber = { version = "=0.3.11", features = ["registry", "env-filter", "fmt", "std"] }
url = "=2.2.2"
uuid = { version = "=0.8.2", features = ["serde", "v1", "v4"] }
xlsxwriter = "0.3.5"
xmltree = "=0.10.3"
xml-rs = "=0.8.4"
zip = "=0.6.2"
humantime="=2.1.0"
nom="=7.1.1"
